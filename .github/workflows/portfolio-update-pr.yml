name: Prepare portfolio update pull request

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-update-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare-update:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/portfolio-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install portfolio checks and PDF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          npm ci
          python -m pip install -r requirements-automation.txt

      - name: Validate project facts and open a review pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/apply_portfolio_update.py
