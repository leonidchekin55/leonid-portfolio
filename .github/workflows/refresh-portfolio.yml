name: Refresh portfolio and resume

on:
  push:
    branches: [main]
    paths:
      - "content/portfolio.json"
      - "scripts/build_portfolio.py"
      - "scripts/sync_google_doc.py"
      - "index.html"
      - "en.html"
      - ".github/workflows/refresh-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: portfolio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install resume build tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements-automation.txt

      - name: Build localized project cards and resume PDF
        run: python scripts/build_portfolio.py

      - name: Authenticate to Google Cloud with GitHub OIDC
        if: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GOOGLE_SERVICE_ACCOUNT_EMAIL != '' && vars.GOOGLE_RESUME_DOC_ID != '' }}
        uses: google-github-actions/auth@v2
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT_EMAIL }}

      - name: Sync the Google Doc when federation is configured
        env:
          GOOGLE_RESUME_DOC_ID: ${{ vars.GOOGLE_RESUME_DOC_ID }}
        run: |
          if [ -n "${GOOGLE_RESUME_DOC_ID:-}" ] && [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            python scripts/sync_google_doc.py
          else
            echo "::warning::Site and PDF refreshed. Configure Google Workload Identity Federation and GOOGLE_RESUME_DOC_ID to enable automatic Google Doc sync."
          fi

      - name: Commit generated site and PDF
        run: |
          if ! git diff --quiet -- index.html en.html downloads/Leonid_Chekin_Resume_Python_AI_FinTech.pdf; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html en.html downloads/Leonid_Chekin_Resume_Python_AI_FinTech.pdf
            git commit -m "Build portfolio and resume from content source"
            git push origin HEAD:main
          else
            echo "Generated files are already up to date."
          fi


  website-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check public pages and download links
        run: node scripts/audit.mjs
