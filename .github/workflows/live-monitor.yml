name: Daily portfolio availability monitor

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-portfolio-availability
  cancel-in-progress: true

jobs:
  public-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public portfolio sites and demo APIs
        run: python scripts/audit_live_services.py
