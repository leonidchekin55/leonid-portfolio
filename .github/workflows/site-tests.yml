name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install resume PDF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          python -m pip install -r requirements-automation.txt
      - name: Build and verify the two-page resume
        run: |
          python scripts/build_portfolio.py
          test "$(pdfinfo downloads/Leonid_Chekin_Resume_Python_AI_FinTech.pdf | awk '/^Pages:/ { print $2 }')" -eq 2
      - run: npm ci
      - name: Test portfolio update automation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - run: npm test
