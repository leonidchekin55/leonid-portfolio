name: Discover new GitHub portfolio projects

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: discover-github-projects
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find new public repositories and prepare portfolio drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/discover_github_projects.py
      - name: Save discovery checkpoint
        run: |
          if ! git diff --quiet -- content/github-project-discovery.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/github-project-discovery.json
            git commit -m "Track discovered GitHub portfolio projects"
            git push
          fi
