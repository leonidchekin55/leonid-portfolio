<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Политика конфиденциальности — Леонид Чекин</title><style>body{font:16px/1.6 Arial,sans-serif;max-width:760px;margin:48px auto;padding:0 20px;color:#172a24}a{color:#375f37}</style></head><body><h1>Политика конфиденциальности</h1><p>Сайт-портфолио не содержит формы и не собирает персональные данные на сервере. Ссылки на Telegram и GitHub открывают соответствующие внешние сервисы; их обработка данных регулируется их собственными правилами.</p><p><a href="/">Вернуться в портфолио</a></p></body></html>
